name: polyledger

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: polyledger
      POSTGRES_PASSWORD: polyledger
      POSTGRES_DB: polyledger
    ports:
      - '127.0.0.1:5440:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U polyledger -d polyledger']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # BullMQ jobs must survive a Redis restart.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6381:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
